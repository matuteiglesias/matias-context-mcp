name: W3 context-routing interface proof

on:
  pull_request:
  push:
    branches:
      - feat/w3-context-routing-interface-proof

permissions:
  contents: read

jobs:
  prove-context-routing-edge:
    runs-on: ubuntu-latest
    env:
      MATIAS_CONTEXT_GATEWAY_CONFIG: ${{ github.workspace }}/config/sources.example.json
      CONTEXT_ROUTING_ROOT: ${{ github.workspace }}/tests/fixtures/context_routing_provenance
      KB_CONTRACTS_ROOT: ${{ github.workspace }}/.w3-empty/kb-contracts
      KNOWLEDGE_INSPECT_ROOT: ${{ github.workspace }}/.w3-empty/knowledge-inspect
      KB_ARTIFACTS_ROOT: ${{ github.workspace }}/.w3-empty/kb-artifacts

    steps:
      - name: Checkout MCP consumer and frozen public evidence
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install consumer
        run: python -m pip install -e '.[dev]'

      - name: Run canonical checks
        run: make check

      - name: Run verified v0.1 stdio smoke
        run: make smoke

      - name: Run verified v0.2 stdio smoke
        run: make smoke-v02

      - name: Run M6 bootstrap adoption experiment
        run: make adoption-experiment

      - name: Prepare verified source mounts
        run: |
          PYTHONPATH=src python - <<'PY'
          import os
          from pathlib import Path

          from matias_context_mcp.profile import PROFILE_BY_SOURCE
          from scripts.smoke_fixture import write_source_fixture

          for source_id in (
              "context-routing",
              "kb-contracts",
              "knowledge-inspect",
              "kb-artifacts",
          ):
              source = PROFILE_BY_SOURCE[source_id]
              write_source_fixture(
                  source,
                  Path(os.environ[source.root_env]),
              )
          PY

      - name: Prove provenance-pinned producer artifact through real MCP stdio
        run: |
          python scripts/verify_context_routing_edge.py \
            --fixture-root "$CONTEXT_ROUTING_ROOT" \
            --provenance "$CONTEXT_ROUTING_ROOT/provenance.json"
