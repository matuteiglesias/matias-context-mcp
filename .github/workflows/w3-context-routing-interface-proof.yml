name: W3 context-routing interface proof

on:
  pull_request:
  push:
    branches:
      - test/w3-context-routing-interface-proof

jobs:
  prove-context-routing-to-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MCP consumer
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MCP consumer
        run: python -m pip install -e '.[dev]'

      - name: Check out pinned Context Routing producer
        uses: actions/checkout@v4
        with:
          repository: matuteiglesias/context-routing
          ref: aa8ffbd5d3c90b4819b27ba6e039b30a21ef38a2
          path: .w3/context-routing

      - name: Generate deterministic public routing catalog
        run: |
          python .w3/context-routing/scripts/build_context_routing.py \
            --fixture .w3/context-routing/tests/fixtures/context_routing/registry-valid.json \
            --generated-at 2026-08-28T00:00:00+00:00 \
            --output-root .w3/context-routing \
            --source-root .w3/context-routing/static \
            --skip-build-validation

      - name: Prove generated producer artifact crosses MCP boundary
        env:
          CONTEXT_ROUTING_W3_ROOT: ${{ github.workspace }}/.w3/context-routing
        run: python -m pytest -q tests/test_w3_context_routing_interface.py

      - name: Run consumer regression suite
        run: python -m pytest -q
