# This file declares the repository boundary and its place in the GitHub estate.
schema_version: 1
id: kb.mcp.gateway
repository:
  id: repo.matias-context-mcp
  github: matuteiglesias/matias-context-mcp
domain: knowledge
system: kb.mcp
role: read-only-context-gateway
lifecycle: active
authority:
  status: proposed
  owns:
  - bounded read-only MCP transport
  - matias-context resource namespace and access adapters
  does_not_own:
  - source repository authority
  - producer mutation
  - arbitrary filesystem access
interfaces:
  consumes:
  - catalog:kb.context-routing@1
  - contract:kb.run-manifest@1
  - artifact:kb.run-manifest@1
  - artifact:kb.selected-evidence@1
  produces:
  - protocol:mcp.matias-context@1
upstream:
- repo.context-routing
- repo.kb-artifacts
- repo.kb-contracts
- repo.knowledge-inspect
downstream: []
canonical_commands:
- python3 -m matias_context_mcp
- mctx list
- mctx templates
- python3 -m pytest -q
- python3 scripts/probe_mcp.py --output-dir artifacts/mvp-evidence
generated_paths:
- artifacts/mvp-evidence/
verification:
  status: metadata-only
  last_verified: '2026-08-28'
  command: python3 -m pytest -q
  unknowns:
  - canonical commands were reconciled against README.md and AGENTS.md but not executed during W2
  - README states the resource-only v0.1 MVP is closed while AGENTS.md retains historical P0/P1 work items; current defect state needs a separate runtime verification if consequential
maintenance:
  cadence: quarterly
  next_review: '2026-11-01'
