# This file declares the repository boundary and its place in the GitHub estate.
schema_version: 1
id: kb.mcp.gateway
repository:
  id: repo.matias-context-mcp
  github: matuteiglesias/matias-context-mcp
domain: knowledge
system: kb.mcp
role: read-only-context-gateway
lifecycle: active
authority:
  status: proposed
  owns:
  - bounded read-only MCP transport
  - matias-context resource namespace and access adapters
  - explicit static v0.1, v0.2 and v0.3 exposure-profile selection
  - deterministic client-side Project Agenda bootstrap composition
  - deterministic client-side portfolio freshness orientation
  - manifest-bound read-only selected-evidence transport in explicit v0.3
  does_not_own:
  - source repository authority
  - producer mutation
  - arbitrary filesystem access
interfaces:
  consumes:
  - catalog:kb.context-routing@1
  - contract:kb.run-manifest@1
  - artifact:kb.run-manifest@1
  - artifact:kb.selected-evidence@1
  - context:project-agendas@1
  produces:
  - protocol:mcp.matias-context@1
  - protocol:mcp.matias-context@2
  - protocol:mcp.matias-context@3
  - artifact:mctx.bootstrap@1
  - artifact:mctx.portfolio@1
  - artifact:mctx.evidence@1
upstream:
- repo.context
- repo.gpt-digests
- repo.kb-contracts
- repo.knowledge-inspect
- repo.projects
downstream: []
canonical_commands:
- python3 -m matias_context_mcp
- mctx list
- mctx templates
- mctx bootstrap media-monitor --as-of 2026-10-07
- mctx portfolio --as-of 2026-10-07
- mctx evidence m7-media-monitor-fixture
- make test
- make check
- make bootstrap-test
- make adoption-experiment
- make knowledge-composition-proof KNOWLEDGE_INSPECT_ROOT=/path/to/pinned/knowledge-inspect KB_ARTIFACTS_ROOT=/path/to/pinned/kb-artifacts
- make smoke
- make smoke-v02
- make smoke-v03
- make media-synthesis-proof MEDIA_MONITOR_ROOT=/path/to/pinned/media-monitor KB_ARTIFACTS_ROOT=/path/to/pinned/kb-artifacts
- python3 scripts/probe_mcp.py --output-dir artifacts/mvp-evidence
generated_paths:
- artifacts/mvp-evidence/
- artifacts/v02-evidence/
- artifacts/m6-adoption/
- artifacts/m7-knowledge-composition/
verification:
  status: trusted-v0.1-v0.2-v0.3-selected-evidence-media-composition-ci
  last_verified: '2026-10-07'
  command: make check; make bootstrap-test; make smoke; make smoke-v02; make adoption-experiment; make knowledge-composition-proof
  proven:
  - PR #9 established the trusted four-source v0.1 startup boundary
  - PR #11 established the explicit five-source v0.2 profile while preserving exact v0.1 compatibility
  - PR #13 proves deterministic mctx bootstrap over ordinary real-MCP stdio reads with fail-closed Agenda/index SHA reconciliation
  - PR #15 passes the bounded Media/Poverty adoption experiment while intentionally leaving MCP resource reads unchanged
  - PR #18 adds deterministic mctx.portfolio@1 as a two-read client composition; 2026-10-07 dogfood across Projects PRs #57-#59 validates review-horizon routing while explicitly rejecting live material-change and priority claims
  - PR #17 pins Knowledge Inspect 7832ed5f33df03e87b2b146cd51f798121c79dc8 and KB Artifacts 44ceeef3e7d851e1bb89c9d974100e0d3b4d6242
  - PR #17 proves summary_bus -> producer-owned generic evidence JSONL -> generic named-corpus selection -> path-safe KB Artifacts manifest -> existing MCP manifest resource
  - PR #17 proves adapter-output SHA-256 continuity into the KB Artifacts manifest and one selected-evidence artifact identity
  - PR #17 proves the MCP response is the verified KB Artifacts manifest and leaks neither producer checkout root
  - Media synthesis dogfood proves Media Monitor producer-owned evidence -> generic KB named-corpus topic/date selection -> checksum-bound selected.jsonl -> v0.3 MCP body read -> two-channel recurring-claim reconstruction
  - v0.3 remains explicit opt-in; v0.1 and v0.2 retain exact prior resource surfaces and do not expose selected evidence bodies
  - the provenance-pinned Context Routing read remains green through the same CI acceptance workflow
  unknowns:
  - local real-mount terminal ergonomics for mctx portfolio were not exercised on 2026-10-07 because the authorized Desktop Commander host was offline; CI exercised the real stdio implementation and live-state dogfood evaluated the same deterministic logic against the committed Projects index
  - portfolio review windows do not detect material within-window change; Poverty and Accounting supplied real counterexamples, and no fresh governed activity signal currently exists for a safe join
  - live producer run availability remains request-local and is not enumerated at startup
  - producer source-control provenance is pinned by CI refs but not remotely attested by the local gateway at runtime
  - M7 proves summary_bus/chunk_set_summary composition only; other Knowledge Inspect artifact families need separate producer adapters and consumer proofs
  - selected-evidence promotion/publication remains outside MCP; v0.3 exposes only checksum-bound named-corpus selected.jsonl bodies
maintenance:
  cadence: quarterly
  next_review: '2026-11-01'
