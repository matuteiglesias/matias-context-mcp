# This file declares the repository boundary and its place in the GitHub estate.
schema_version: 1
id: kb.mcp.gateway
repository:
  id: repo.matias-context-mcp
  github: matuteiglesias/matias-context-mcp
domain: knowledge
system: kb.mcp
role: read-only-context-gateway
lifecycle: active
authority:
  status: proposed
  owns:
  - bounded read-only MCP transport
  - matias-context resource namespace and access adapters
  - explicit static v0.1 and v0.2 exposure-profile selection
  - deterministic client-side Project Agenda bootstrap composition
  does_not_own:
  - source repository authority
  - producer mutation
  - arbitrary filesystem access
interfaces:
  consumes:
  - catalog:kb.context-routing@1
  - contract:kb.run-manifest@1
  - artifact:kb.run-manifest@1
  - artifact:kb.selected-evidence@1
  - context:project-agendas@1
  produces:
  - protocol:mcp.matias-context@1
  - protocol:mcp.matias-context@2
  - artifact:mctx.bootstrap@1
upstream:
- repo.context
- repo.gpt-digests
- repo.kb-contracts
- repo.knowledge-inspect
- repo.projects
downstream: []
canonical_commands:
- python3 -m matias_context_mcp
- mctx list
- mctx templates
- mctx bootstrap media-monitor --as-of 2026-10-07
- make test
- make check
- make bootstrap-test
- make adoption-experiment
- make smoke
- make smoke-v02
- python3 scripts/probe_mcp.py --output-dir artifacts/mvp-evidence
generated_paths:
- artifacts/mvp-evidence/
- artifacts/v02-evidence/
- artifacts/m6-adoption/
verification:
  status: trusted-v0.1-v0.2-bootstrap-adopted-ci
  last_verified: '2026-10-07'
  command: make check; make bootstrap-test; make smoke; make smoke-v02; make adoption-experiment
  proven:
  - PR #9 established the trusted four-source v0.1 startup boundary
  - PR #11 established the explicit five-source v0.2 profile while preserving exact v0.1 compatibility
  - PR #13 proves deterministic mctx bootstrap over ordinary real-MCP stdio reads with fail-closed Agenda/index SHA reconciliation
  - PR #15 passes the bounded Media/Poverty adoption experiment with semantically equivalent control/treatment results
  - PR #15 reduces client invocations and stdio sessions by 75 percent per case while intentionally leaving MCP resource reads unchanged
  - the provenance-pinned Context Routing read remains green through the same CI acceptance workflow
  unknowns:
  - live producer run availability remains request-local and is not enumerated at startup
  - producer source-control provenance is declared and hashed but not remotely attested by the local gateway
  - the public CI adoption experiment uses synthetic Projects fixture content; live private Projects mounting remains an operator-local acceptance surface
maintenance:
  cadence: quarterly
  next_review: '2026-11-01'
